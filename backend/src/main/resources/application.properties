spring.application.name=aibackend

# ===============================
# Gemini API Configuration
# ===============================
#gemini.api.url=${GEMINI_API_URL}
#gemini.api.key=${GEMINI_API_KEY}

spring.datasource.url=jdbc:postgresql://localhost:5432/genx_db
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=${GEMINI_API_URL}

google.client-id=${GOOGLE_CLIENT_ID:}

# ===============================
# Notification Email Configuration (Gmail SMTP)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}





# ===============================
# Database Configuration (Neon DB)
# ===============================
# We use variables ${...} here so you don't expose secrets in your GitHub code
#spring.datasource.url=${SPRING_DATASOURCE_URL}
#spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
#spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
#spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# Connection Pooling (Crucial for Neon)
# ===============================
# These settings help Spring Boot handle Neon's "sleep" behavior gracefully
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# JPA / Hibernate
# ===============================
# 'update' ensures tables are created/modified automatically on deploy
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Server Configuration
# ===============================
server.address=0.0.0.0
server.port=8080
server.compression.enabled=false
spring.mvc.async.request-timeout=5000
