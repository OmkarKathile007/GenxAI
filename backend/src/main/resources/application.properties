spring.application.name=aibackend

# Loads backend/local.properties (git-ignored) for local secrets like Vapi/Twilio
# keys. Values here override the ${ENV:} defaults below. Safe if the file is absent.
spring.config.import=optional:file:./local.properties

# ===============================
# JWT signing key (REQUIRED)
# ===============================
# HS256 secret used to sign/verify auth tokens. Must be a long, random value of
# at least 32 bytes. Provide it via the JWT_SECRET env var in production, or via
# jwt.secret in local.properties for local dev. Never commit a real value here.
jwt.secret=${JWT_SECRET:}

# ===============================
# CORS (REQUIRED in production)
# ===============================
# Comma-separated list of EXACT origins allowed to call this API. Credentials are
# allowed, so never use a wildcard or a shared-suffix pattern like
# https://*.vercel.app — anyone can deploy there and would become a trusted origin.
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:3000}

# ===============================
# Vapi webhook shared secret (REQUIRED)
# ===============================
# Shared secret Vapi sends on webhook calls (configure the same value as the
# "Server URL Secret" on your Vapi assistant/number). The webhook rejects every
# request whose X-Vapi-Secret header does not match, and rejects all requests
# outright when this is unset — it must not fail open on a public endpoint.
vapi.webhook.secret=${VAPI_WEBHOOK_SECRET:}

# ===============================
# Gemini API Configuration
# ===============================
#gemini.api.url=${GEMINI_API_URL}
#gemini.api.key=${GEMINI_API_KEY}

# Defaults target a local dev database. Production supplies the real values via
# the SPRING_DATASOURCE_* environment variables (which already override these —
# writing them as ${VAR:default} just makes that contract explicit).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/genx_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=${GEMINI_API_URL}

# Use the same web OAuth client ID as the frontend. Accept its existing setting
# in local.properties too; GOOGLE_CLIENT_ID remains the preferred backend env var.
google.client-id=${GOOGLE_CLIENT_ID:${NEXT_PUBLIC_GOOGLE_CLIENT_ID:}}

# ===============================
# Notification Email Configuration (SMTP / Gmail)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.sender=${MAIL_USERNAME:no-reply@genxai.com}

app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}

# ===============================
# Vapi outbound phone calling (server-side ONLY — never expose the private key)
# ===============================
vapi.api.base-url=${VAPI_API_BASE_URL:https://api.vapi.ai}
vapi.private.key=${VAPI_PRIVATE_KEY:}
vapi.assistant.id=${VAPI_ASSISTANT_ID:}
vapi.phone.number.id=${VAPI_PHONE_NUMBER_ID:}

# ===============================
# Twilio SMS / WhatsApp invitesne
# ===============================
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.sms.from=${TWILIO_SMS_FROM:}
twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM:}
twilio.default.channel=${TWILIO_DEFAULT_CHANNEL:WHATSAPP}

# Path appended to app.frontend.url to build the invite link, e.g. http://localhost:3000/invite/{token}
app.invite.base-path=${APP_INVITE_BASE_PATH:/invite}
# Auto-send the invite when Vapi reports the call ended (needs a public webhook URL)
app.invite.auto-send=${APP_INVITE_AUTO_SEND:false}





# ===============================
# Database Configuration (Neon DB)
# ===============================
# We use variables ${...} here so you don't expose secrets in your GitHub code
#spring.datasource.url=${SPRING_DATASOURCE_URL}
#spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
#spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
#spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# Connection Pooling (Crucial for Neon)
# ===============================
# These settings help Spring Boot handle Neon's "sleep" behavior gracefully
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# Flyway — Flyway owns the schema, Hibernate does not
# ===============================
# Migrations live in src/main/resources/db/migration and run automatically
# on startup, before Hibernate validates the entity mappings.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

# The production database already exists (created by the old ddl-auto=update).
# baseline-on-migrate stamps that existing schema as "already at V1" instead of
# trying to re-create tables that are already there — V1__baseline.sql therefore
# only ever executes on a fresh database. Once every environment has been
# baselined this flag can be removed.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=existing schema created by hibernate ddl-auto

# Refuse to start if a previously-applied migration file was edited. Migrations
# are immutable once shipped; to change something, add a new version.
spring.flyway.validate-on-migrate=true

# Never let Flyway wipe a schema, even if something calls flyway.clean().
spring.flyway.clean-disabled=true

# ===============================
# JPA / Hibernate
# ===============================
# 'validate' — Hibernate checks that the entity mappings match the schema
# Flyway produced, and never modifies the database itself. Any schema change
# must ship as a new versioned migration.
#
# ESCAPE HATCH: if a startup fails with a schema-validation error in
# production, set DDL_AUTO=none to boot without the check while you write the
# corrective migration. Do NOT set it back to 'update' — that would let
# Hibernate silently alter the schema behind Flyway's back and desynchronise
# the two.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Server Configuration
# ===============================
server.address=0.0.0.0
server.port=8080
server.compression.enabled=false
spring.mvc.async.request-timeout=5000

# ===============================
# Monitoring & Actuator
# ===============================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# ===============================
# Sentry Monitoring & Error Tracking
# ===============================
sentry.dsn=${SENTRY_DSN:}
sentry.traces-sample-rate=1.0

# ===============================
# Free-tier usage limits (per user, lifetime)
# ===============================
app.limits.enabled=${LIMITS_ENABLED:true}
app.limits.vapi.max-calls=${LIMITS_VAPI_MAX_CALLS:2}
app.limits.vapi.max-call-seconds=${LIMITS_VAPI_MAX_SECONDS:60}
app.limits.ai.max-calls=${LIMITS_AI_MAX_CALLS:2}
