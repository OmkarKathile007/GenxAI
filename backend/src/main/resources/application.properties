spring.application.name=aibackend

# Loads backend/local.properties (git-ignored) for local secrets like Vapi/Twilio
# keys. Values here override the ${ENV:} defaults below. Safe if the file is absent.
spring.config.import=optional:file:./local.properties

# ===============================
# JWT signing key (REQUIRED)
# ===============================
# HS256 secret used to sign/verify auth tokens. Must be a long, random value of
# at least 32 bytes. Provide it via the JWT_SECRET env var in production, or via
# jwt.secret in local.properties for local dev. Never commit a real value here.
jwt.secret=${JWT_SECRET:}

# ===============================
# CORS (REQUIRED in production)
# ===============================
# Comma-separated list of EXACT origins allowed to call this API. Credentials are
# allowed, so never use a wildcard or a shared-suffix pattern like
# https://*.vercel.app — anyone can deploy there and would become a trusted origin.
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:3000}

# ===============================
# Vapi webhook shared secret (REQUIRED)
# ===============================
# Shared secret Vapi sends on webhook calls (configure the same value as the
# "Server URL Secret" on your Vapi assistant/number). The webhook rejects every
# request whose X-Vapi-Secret header does not match, and rejects all requests
# outright when this is unset — it must not fail open on a public endpoint.
vapi.webhook.secret=${VAPI_WEBHOOK_SECRET:}

# ===============================
# Gemini API Configuration
# ===============================
#gemini.api.url=${GEMINI_API_URL}
#gemini.api.key=${GEMINI_API_KEY}

spring.datasource.url=jdbc:postgresql://localhost:5432/genx_db
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=${GEMINI_API_URL}

google.client-id=${GOOGLE_CLIENT_ID:}

# ===============================
# Notification Email Configuration (SMTP / Gmail)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.sender=${MAIL_USERNAME:no-reply@genxai.com}

app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}

# ===============================
# Vapi outbound phone calling (server-side ONLY — never expose the private key)
# ===============================
vapi.api.base-url=${VAPI_API_BASE_URL:https://api.vapi.ai}
vapi.private.key=${VAPI_PRIVATE_KEY:}
vapi.assistant.id=${VAPI_ASSISTANT_ID:}
vapi.phone.number.id=${VAPI_PHONE_NUMBER_ID:}

# ===============================
# Twilio SMS / WhatsApp invitesne
# ===============================
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.sms.from=${TWILIO_SMS_FROM:}
twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM:}
twilio.default.channel=${TWILIO_DEFAULT_CHANNEL:WHATSAPP}

# Path appended to app.frontend.url to build the invite link, e.g. http://localhost:3000/invite/{token}
app.invite.base-path=${APP_INVITE_BASE_PATH:/invite}
# Auto-send the invite when Vapi reports the call ended (needs a public webhook URL)
app.invite.auto-send=${APP_INVITE_AUTO_SEND:false}





# ===============================
# Database Configuration (Neon DB)
# ===============================
# We use variables ${...} here so you don't expose secrets in your GitHub code
#spring.datasource.url=${SPRING_DATASOURCE_URL}
#spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
#spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
#spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# Connection Pooling (Crucial for Neon)
# ===============================
# These settings help Spring Boot handle Neon's "sleep" behavior gracefully
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# JPA / Hibernate
# ===============================
# 'update' ensures tables are created/modified automatically on deploy
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Server Configuration
# ===============================
server.address=0.0.0.0
server.port=8080
server.compression.enabled=false
spring.mvc.async.request-timeout=5000

# ===============================
# Monitoring & Actuator
# ===============================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# ===============================
# Sentry Monitoring & Error Tracking
# ===============================
sentry.dsn=${SENTRY_DSN:}
sentry.traces-sample-rate=1.0

# ===============================
# Free-tier usage limits (per user, lifetime)
# ===============================
app.limits.enabled=${LIMITS_ENABLED:true}
app.limits.vapi.max-calls=${LIMITS_VAPI_MAX_CALLS:2}
app.limits.vapi.max-call-seconds=${LIMITS_VAPI_MAX_SECONDS:60}
app.limits.ai.max-calls=${LIMITS_AI_MAX_CALLS:2}
